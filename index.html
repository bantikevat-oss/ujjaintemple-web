<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <!-- charset is emitted by SEOHead so helmet places it first in <head>; see SEOHead.tsx -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#8B1A1A" />
    <meta name="format-detection" content="telephone=yes" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Self-hosted fonts (no Google CDN) — drop woff2 files in /public/fonts/ then re-enable preload -->
    <!-- <link rel="preload" as="font" type="font/woff2" href="/fonts/notosans-devanagari-400.woff2" crossorigin /> -->
    <!-- <link rel="preload" as="font" type="font/woff2" href="/fonts/dmsans-400.woff2" crossorigin /> -->

    <!-- No hero preload here: this template ships on every route. Home preloads its own. -->

    <!-- DNS prefetch for tag manager (deferred 2.5s) -->
    <link rel="dns-prefetch" href="https://www.googletagmanager.com" />
    <link rel="dns-prefetch" href="https://www.google-analytics.com" />

    <!-- GA4 — property G-2E9XG3RLPS, connected 2026-09-11.
         The config call is queued here and the library itself is fetched later by
         #gtag-injector below; gtag() writes into dataLayer, so commands issued
         before the script arrives are replayed in order once it loads. This is
         Google's own documented ordering, not a workaround. -->
    <script id="gtag-init">
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-2E9XG3RLPS');

      // Lead clicks → GA4 events (marked as key events in GA). Only OUR line counts:
      // the share button (wa.me/?text=) and temple phone numbers on mandir pages are
      // not leads. tel: clicks are invisible to enhanced measurement, hence this.
      // Capture phase + delegation, so React-rendered links are covered too.
      document.addEventListener('click', function (e) {
        var a = e.target && e.target.closest && e.target.closest('a[href]');
        if (!a) return;
        var href = a.getAttribute('href') || '';
        var name = /^tel:\+?(91)?7400724456$/.test(href.replace(/[\s-]/g, '')) ? 'call_click'
          : /(wa\.me|api\.whatsapp\.com\/send\?phone=)\/?917400724456/.test(href) ? 'whatsapp_click'
          : null;
        if (name) gtag('event', name, { link_url: href, transport_type: 'beacon' });
      }, true);
    </script>

    <!-- title / description / canonical are injected PER-PAGE by react-helmet-async (SEOHead) during SSG.
         Hardcoding them here created DUPLICATE title+canonical on all 450 pages (homepage-canonical
         shadowed every inner page → deindex risk). Removed 2026-06-18 — helmet emits one correct set per
         route into the static HTML. Do NOT re-add title / canonical / description here. -->
  </head>
  <body class="bg-cream text-ink font-sans antialiased">
    <a href="#main" class="sr-only focus:not-sr-only focus:fixed focus:top-2 focus:left-2 focus:z-50 focus:bg-white focus:px-4 focus:py-2 focus:rounded focus:shadow focus:border-2 focus:border-maroon focus:text-maroon focus:font-semibold">मुख्य सामग्री पर जाएँ</a>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Fetch gtag.js off the critical path: on first interaction, or when the main
         thread next goes idle, whichever comes first.
         ⚠️ KNOWN TRADE-OFF: a visitor who leaves before the idle callback fires and
         never scrolls or taps is not counted at all. That makes the numbers a slight
         UNDER-count and, more importantly, flatters bounce rate — read GA4 sessions
         here as a floor, and keep using GSC for search numbers. The 1200ms ceiling
         (was 2500ms) exists to keep that blind spot small; drop the delay entirely
         only if exact session counts start mattering more than mobile LCP. -->
    <script id="gtag-injector">
      (function () {
        var fired = false;
        function loadGtag() {
          if (fired) return; fired = true;
          var s = document.createElement('script');
          s.async = true;
          s.src = 'https://www.googletagmanager.com/gtag/js?id=G-2E9XG3RLPS';
          document.head.appendChild(s);
        }
        window.addEventListener('scroll', loadGtag, { once: true, passive: true });
        window.addEventListener('click', loadGtag, { once: true });
        window.addEventListener('touchstart', loadGtag, { once: true, passive: true });
        if ('requestIdleCallback' in window) {
          requestIdleCallback(loadGtag, { timeout: 1200 });
        } else {
          setTimeout(loadGtag, 1200);
        }
      })();
    </script>
  </body>
</html>
